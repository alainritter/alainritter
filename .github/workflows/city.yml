name: City
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  city:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test "city/*.test.mjs"
      # fails (and publishes nothing) if a private repo name ends up in the output
      - run: node city/build.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          OUT_DIR: dist
      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: city
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
