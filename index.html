<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Repo City</title>
<style>
  :root { color-scheme: dark; --bg: #070a14; --fg: #c9d4ff; --accent: #00f0ff; --pink: #ff3cac; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: linear-gradient(transparent, rgba(7, 10, 20, .92)); }
  #hud input { flex: 1; accent-color: var(--accent); }
  button { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; font: inherit; cursor: pointer; }
  #title { position: fixed; top: 12px; left: 16px; letter-spacing: .15em; text-transform: uppercase; }
  #title b { color: var(--pink); }
  #tip { position: fixed; pointer-events: none; padding: 4px 8px; background: rgba(7, 10, 20, .9); border: 1px solid var(--accent); display: none; }
  #tip a { color: var(--accent); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="title"><b>repo</b> city · <span id="stats">loading</span></div>
<div id="tip"></div>
<div id="hud">
  <button id="play" type="button">Play</button>
  <input id="week" type="range" min="0" max="11" value="11" aria-label="Week" />
  <span id="weekLabel">now</span>
</div>
<script type="module" src="city.js"></script>
</body>
</html>
